version: 2
policy: |
  本表只登记"官方出处（或登记表已注明的镜像全文）+ 条号级检索定位"，不登记规则内容、天数、金额、费率或机制结论。
  每条锚点必须同时具备：官方来源 id、条号定位、核验日期、在该版本文本中的命中说明。
  官方站点拒绝自动抓取、全文仅能由记哈希的镜像文本取回时，锚点可以保留：via 须写明命中于镜像文本，
  登记表 confidence 按 medium 登记，对外交付前须回官方 PDF 复核。
  锚点不是可引用结论：写入文书前必须重新 fetch / lookup 本案适用版本，并把命中原文与来源标记一并交付。
  无法绑定稳定官方来源的规则不得写入本表，也不得写入 references/、skills/、assets/templates/ 中的规则表述；
  此类事项一律进入 open_questions，按问题处理，不按答案处理。
freshness_days: 90
status_values:
  verified: 已在 basis_source 登记的规则全文（官方文本或已注明的镜像文本）中命中条号标题；须带 checked_at 与 via
  # unverified / absent / superseded 不再允许出现在本文件中。
  # 旧版条号、二手资料与"某机构没有某机制"的否定性断言，均不属于可保留的规则内容。
consumers:
  - references/forum-rules-matrix.md
  - references/procedural-timetable.md
  - scripts/fetch_official.py
  - scripts/rule_audit.py
usage:
  - 锚点只回答"去哪一条找"，不回答"该条写的是什么"。
  - 使用前运行 fetch_official.py applicable 定位本案适用版本，再 fetch 取文、lookup 命中短语。
  - 缓存文本、版本 id 与校验日期不一致时，锚点按未核处理，条号写占位。
  - 官方站点不可达时照常完成本轮工作，但须披露"未核验最新规则可适用性"，不得凭记忆回填条号。
  - 新增锚点只能来自本次实际取回的该版本规则全文；不得从旧版、评论、二手汇编或模型记忆转录，
    镜像命中一律不得写成官方文本命中。

